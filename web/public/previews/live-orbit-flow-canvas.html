<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PAAP · Live Orbit — Flow Canvas</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  body{background:#0a0a12;color:#e0e0e8;font-family:'Inter',-apple-system,sans-serif;min-height:100vh;overflow-x:hidden;display:flex;flex-direction:column;align-items:center}
  
  .header{padding:28px 20px 0;text-align:center;max-width:700px}
  .header h1{font-size:26px;font-weight:800;margin-bottom:4px;background:linear-gradient(135deg,#22d3ee,#a78bfa);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
  .header p{color:#64748b;font-size:12px;line-height:1.4}
  
  .mode-selector{display:flex;justify-content:center;gap:8px;margin:16px 0 0}
  .mode-btn{padding:7px 16px;border-radius:10px;border:1px solid rgba(255,255,255,0.07);background:rgba(255,255,255,0.02);color:#64748b;font-size:11px;font-weight:600;cursor:pointer;transition:all 0.25s;letter-spacing:0.3px}
  .mode-btn:hover{border-color:rgba(255,255,255,0.12);color:#94a3b8}
  .mode-btn.active{background:rgba(34,211,238,0.08);border-color:rgba(34,211,238,0.25);color:#22d3ee}
  
  .canvas{position:relative;width:700px;height:560px;margin:20px auto 0;background:#08080f;border-radius:16px;border:1px solid rgba(255,255,255,0.05);overflow:hidden}
  .canvas::before{content:'';position:absolute;inset:0;background-image:radial-gradient(circle,rgba(255,255,255,0.025) 1px,transparent 1px);background-size:18px 18px;opacity:0.7}
  
  /* ── Layer Labels ── */
  .layer{position:absolute;left:0;width:100%;display:flex;justify-content:center;pointer-events:none;z-index:1}
  .layer-tag{font-size:9px;font-weight:700;letter-spacing:1.5px;text-transform:uppercase;padding:3px 10px;border-radius:6px;opacity:0.6}
  .layer-gateway .layer-tag{background:rgba(34,211,238,0.06);color:#22d3ee}
  .layer-tools .layer-tag{background:rgba(167,139,250,0.06);color:#a78bfa}
  .layer-providers .layer-tag{background:rgba(251,191,36,0.06);color:#fbbf24}
  
  /* ── Nodes ── */
  .node{position:absolute;display:flex;align-items:center;justify-content:center;z-index:10;cursor:pointer;transition:transform 0.25s ease}
  .node:hover{transform:scale(1.08)}
  .node-icon{width:50px;height:50px;border-radius:13px;border:2px solid;display:flex;align-items:center;justify-content:center;font-size:20px;position:relative;transition:box-shadow 0.3s}
  
  /* PAAP */
  .n-paap .node-icon{background:linear-gradient(135deg,rgba(34,211,238,0.1),rgba(34,211,238,0.03));border-color:rgba(34,211,238,0.35);box-shadow:0 0 20px rgba(34,211,238,0.15),0 2px 8px rgba(0,0,0,0.3)}
  .n-paap:hover .node-icon{box-shadow:0 0 28px rgba(34,211,238,0.3),0 2px 8px rgba(0,0,0,0.3)}
  
  /* Tools */
  .n-tool .node-icon{background:linear-gradient(135deg,rgba(167,139,250,0.1),rgba(167,139,250,0.03));border-color:rgba(167,139,250,0.3);box-shadow:0 0 16px rgba(167,139,250,0.1),0 2px 8px rgba(0,0,0,0.3)}
  .n-tool:hover .node-icon{box-shadow:0 0 24px rgba(167,139,250,0.25),0 2px 8px rgba(0,0,0,0.3)}
  .n-tool.dim .node-icon{opacity:0.25;border-color:rgba(255,255,255,0.04);box-shadow:none}
  
  /* Providers */
  .n-prov .node-icon{background:linear-gradient(135deg,rgba(251,191,36,0.1),rgba(251,191,36,0.03));border-color:rgba(251,191,36,0.3);box-shadow:0 0 16px rgba(251,191,36,0.1),0 2px 8px rgba(0,0,0,0.3)}
  .n-prov:hover .node-icon{box-shadow:0 0 24px rgba(251,191,36,0.25),0 2px 8px rgba(0,0,0,0.3)}
  
  /* ── SVG ── */
  .svg{position:absolute;top:0;left:0;width:100%;height:100%;pointer-events:none;z-index:4}
  .edge{fill:none;stroke-width:1.5;stroke-linecap:round}
  .e-down{stroke-dasharray:6,5}
  .e-up{stroke-dasharray:5,6}
  .e-cyan{stroke:rgba(34,211,238,0.4)}
  .e-purple{stroke:rgba(167,139,250,0.35)}
  .e-amber{stroke:rgba(251,191,36,0.3)}
  .e-return{stroke:rgba(34,211,238,0.28);stroke-dasharray:4,7}
  
  @keyframes go-down{to{stroke-dashoffset:-22}}
  @keyframes go-up{to{stroke-dashoffset:22}}
  .anim-down{animation:go-down 1.6s linear infinite}
  .anim-up{animation:go-up 2.2s linear infinite}
  
  /* Dots */
  .dot{r:3}
  .d-cyan{fill:#22d3ee;filter:drop-shadow(0 0 5px rgba(34,211,238,0.7))}
  .d-purple{fill:#a78bfa;filter:drop-shadow(0 0 5px rgba(167,139,250,0.7))}
  .d-amber{fill:#fbbf24;filter:drop-shadow(0 0 5px rgba(251,191,36,0.7))}
  
  /* ── Legend ── */
  .legend{display:flex;justify-content:center;gap:20px;margin:14px 0 0;font-size:10px;color:#475569}
  .legend-item{display:flex;align-items:center;gap:5px}
  .legend-bar{width:18px;height:2px;border-radius:1px}
  
  @media(max-width:740px){
    .canvas{width:100%;height:500px;border-radius:0;border-left:none;border-right:none}
    .node-icon{width:42px;height:42px;border-radius:11px;font-size:17px}
  }
</style>
</head>
<body>

<div class="header">
  <h1>PAAP · Live Orbit</h1>
  <p>Request flow: PAAP → Tools → Provider · Response flow: Provider → PAAP</p>
</div>

<div class="mode-selector">
  <div class="mode-btn active" onclick="setMode('tools')">With Tools</div>
  <div class="mode-btn" onclick="setMode('direct')">Direct</div>
  <div class="mode-btn" onclick="setMode('both')">Both</div>
</div>

<div class="canvas">
  <!-- Layer tags -->
  <div class="layer layer-gateway" style="top:28px"><span class="layer-tag">Gateway</span></div>
  <div class="layer layer-tools" style="top:210px"><span class="layer-tag">Tools</span></div>
  <div class="layer layer-providers" style="top:398px"><span class="layer-tag">Providers</span></div>

  <!-- SVG edges -->
  <svg class="svg" viewBox="0 0 700 560">
    <!-- Request: PAAP → Tools -->
    <path id="rt-pv" class="edge e-down e-cyan anim-down" d="M350 85 C350 140 245 160 245 220"/>
    <path id="rt-pw" class="edge e-down e-cyan anim-down" d="M350 85 C350 140 455 160 455 220"/>
    
    <!-- Request: Tools → Providers -->
    <path id="rt-vx" class="edge e-down e-purple anim-down" d="M245 280 C245 330 160 350 160 400"/>
    <path id="rt-vd" class="edge e-down e-purple anim-down" d="M245 280 C245 330 300 350 300 400"/>
    <path id="rt-wk" class="edge e-down e-amber anim-down" d="M455 280 C455 330 430 350 430 400"/>
    <path id="rt-wm" class="edge e-down e-amber anim-down" d="M455 280 C455 330 570 350 570 400"/>
    
    <!-- Response: Provider → PAAP (up) -->
    <path id="rp-x" class="edge e-up e-return anim-up" d="M160 400 C160 300 350 180 350 85"/>
    <path id="rp-d" class="edge e-up e-return anim-up" d="M300 400 C300 300 350 180 350 85"/>
    <path id="rp-k" class="edge e-up e-return anim-up" d="M430 400 C430 300 350 180 350 85"/>
    <path id="rp-m" class="edge e-up e-return anim-up" d="M570 400 C570 300 350 180 350 85"/>
    
    <!-- Direct: PAAP → Providers -->
    <path id="dt-x" class="edge e-down e-cyan anim-down" d="M350 85 C350 220 160 320 160 400" style="display:none"/>
    <path id="dt-d" class="edge e-down e-cyan anim-down" d="M350 85 C350 220 300 320 300 400" style="display:none"/>
    <path id="dt-k" class="edge e-down e-amber anim-down" d="M350 85 C350 220 430 320 430 400" style="display:none"/>
    <path id="dt-m" class="edge e-down e-amber anim-down" d="M350 85 C350 220 570 320 570 400" style="display:none"/>
    
    <!-- Dots: request down -->
    <circle class="dot d-cyan"><animateMotion dur="1.4s" repeatCount="indefinite" path="M350 85 C350 140 245 160 245 220"/></circle>
    <circle class="dot d-cyan"><animateMotion dur="1.5s" repeatCount="indefinite" path="M350 85 C350 140 455 160 455 220"/></circle>
    <circle class="dot d-purple"><animateMotion dur="1.3s" repeatCount="indefinite" path="M245 280 C245 330 160 350 160 400"/></circle>
    <circle class="dot d-purple"><animateMotion dur="1.4s" repeatCount="indefinite" path="M245 280 C245 330 300 350 300 400"/></circle>
    <circle class="dot d-amber"><animateMotion dur="1.5s" repeatCount="indefinite" path="M455 280 C455 330 430 350 430 400"/></circle>
    <circle class="dot d-amber"><animateMotion dur="1.6s" repeatCount="indefinite" path="M455 280 C455 330 570 350 570 400"/></circle>
    
    <!-- Dots: response up -->
    <circle class="dot d-cyan"><animateMotion dur="2s" repeatCount="indefinite" path="M160 400 C160 300 350 180 350 85"/></circle>
    <circle class="dot d-cyan"><animateMotion dur="2.1s" repeatCount="indefinite" path="M300 400 C300 300 350 180 350 85"/></circle>
    <circle class="dot d-purple"><animateMotion dur="1.9s" repeatCount="indefinite" path="M430 400 C430 300 350 180 350 85"/></circle>
    <circle class="dot d-purple"><animateMotion dur="2.2s" repeatCount="indefinite" path="M570 400 C570 300 350 180 350 85"/></circle>
  </svg>

  <!-- PAAP -->
  <div class="node n-paap" style="top:52px;left:50%;transform:translateX(-50%)"><div class="node-icon">⚡</div></div>

  <!-- Tools -->
  <div class="node n-tool" id="t-vision" style="top:215px;left:calc(50% - 105px)"><div class="node-icon">👁</div></div>
  <div class="node n-tool" id="t-web" style="top:215px;left:calc(50% + 55px)"><div class="node-icon">🔍</div></div>

  <!-- Providers -->
  <div class="node n-prov" style="top:395px;left:calc(50% - 190px)"><div class="node-icon">🟠</div></div>
  <div class="node n-prov" style="top:395px;left:calc(50% - 50px)"><div class="node-icon">🔵</div></div>
  <div class="node n-prov" style="top:395px;left:calc(50% + 80px)"><div class="node-icon">🔴</div></div>
  <div class="node n-prov" style="top:395px;left:calc(50% + 220px)"><div class="node-icon">🔷</div></div>
</div>

<div class="legend">
  <div class="legend-item"><div class="legend-bar" style="background:rgba(34,211,238,0.5)"></div>Request</div>
  <div class="legend-item"><div class="legend-bar" style="background:rgba(34,211,238,0.28)"></div>Response</div>
  <div class="legend-item"><div class="legend-bar" style="background:rgba(167,139,250,0.35)"></div>Tool</div>
  <div class="legend-item"><div class="legend-bar" style="background:rgba(251,191,36,0.3)"></div>Provider</div>
</div>

<script>
function setMode(m){
  document.querySelectorAll('.mode-btn').forEach(b=>b.classList.remove('active'));
  event.currentTarget.classList.add('active');
  const t=['rt-pv','rt-pw','rt-vx','rt-vd','rt-wk','rt-wm','rp-x','rp-d','rp-k','rp-m'];
  const d=['dt-x','dt-d','dt-k','dt-m'];
  t.forEach(i=>{const e=document.getElementById(i);if(e)e.style.display=m==='direct'?'none':''});
  d.forEach(i=>{const e=document.getElementById(i);if(e)e.style.display=m==='tools'?'none':''});
  document.getElementById('t-vision').classList.toggle('dim',m==='direct');
  document.getElementById('t-web').classList.toggle('dim',m==='direct');
}
</script>

</body>
</html>
