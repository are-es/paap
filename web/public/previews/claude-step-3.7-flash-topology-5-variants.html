<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>PAAP Topology Redesign - 5 Variants</title>
<style>
  :root {
    --bg: #0b0c14;
    --card: #131420;
    --border: rgba(255,255,255,0.06);
    --text: #e6e8ef;
    --muted: #8a8fa6;
    --cyan: #22d3ee;
    --magenta: #e04090;
    --amber: #f59e0b;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif;
    min-height: 100vh;
  }
  .wrap {
    max-width: 1200px;
    margin: 0 auto;
    padding: 24px 18px 60px;
  }
  .header {
    display: flex;
    align-items: end;
    justify-content: space-between;
    gap: 16px;
    margin-bottom: 18px;
  }
  .header h1 {
    margin: 0;
    font-size: 18px;
    letter-spacing: .04em;
  }
  .header p {
    margin: 6px 0 0;
    color: var(--muted);
    font-size: 12px;
  }
  .badge {
    font-size: 11px;
    color: var(--muted);
    border: 1px solid var(--border);
    padding: 6px 10px;
    border-radius: 999px;
    background: rgba(19,18,32,0.7);
    backdrop-filter: blur(10px);
  }
  .grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 16px;
  }
  .variant {
    border: 1px solid var(--border);
    border-radius: 22px;
    overflow: hidden;
    background: linear-gradient(var(--border) 1px, transparent 1px), linear-gradient(90deg, var(--border) 1px, transparent 1px), var(--card);
    background-size: 28px 28px, 28px 28px, 100% 100%;
  }
  .variant > .stage {
    position: relative;
    width: 100%;
    aspect-ratio: 16 / 9;
    overflow: hidden;
  }
  .variant > .meta {
    padding: 14px 16px;
    border-top: 1px solid var(--border);
    background: rgba(11,12,20,0.55);
    backdrop-filter: blur(10px);
  }
  .meta .name {
    font-size: 13px;
    font-weight: 700;
    letter-spacing: .04em;
  }
  .meta .desc {
    margin-top: 4px;
    font-size: 11px;
    color: var(--muted);
    line-height: 1.45;
  }
  .meta .tags {
    margin-top: 10px;
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
  }
  .tag {
    font-size: 10px;
    color: var(--muted);
    border: 1px solid var(--border);
    padding: 4px 8px;
    border-radius: 999px;
  }
  .legend {
    position: absolute;
    left: 14px;
    top: 14px;
    display: flex;
    gap: 10px;
    z-index: 4;
  }
  .legend span {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    font-size: 10px;
    color: var(--muted);
    background: rgba(19,18,32,0.75);
    border: 1px solid var(--border);
    padding: 5px 9px;
    border-radius: 999px;
    backdrop-filter: blur(10px);
  }
  .dot {
    width: 7px;
    height: 7px;
    border-radius: 50%;
    background: var(--cyan);
    box-shadow: 0 0 7px rgba(34,211,238,0.5);
  }
  .dot.idle { background: #7c829a; box-shadow: none; }
  .dot.offline { background: var(--magenta); opacity: .5; box-shadow: none; }

  .title {
    position: absolute;
    right: 14px;
    top: 14px;
    z-index: 4;
    text-align: right;
  }
  .title h2 {
    margin: 0;
    font-size: 12px;
    font-weight: 700;
    letter-spacing: .06em;
  }
  .title p {
    margin: 3px 0 0;
    font-size: 10px;
    color: var(--muted);
  }

  .center-mark {
    position: absolute;
    left: 50%;
    top: 50%;
    transform: translate(-50%, -50%);
    width: 64px;
    height: 64px;
    border-radius: 50%;
    background: var(--card);
    border: 1.5px solid rgba(34,211,238,0.35);
    box-shadow: 0 0 22px rgba(34,211,238,0.2), inset 0 0 14px rgba(34,211,238,0.12);
    display: grid;
    place-items: center;
    z-index: 3;
  }
  .center-mark::after {
    content: "";
    position: absolute;
    inset: -14px;
    border-radius: 50%;
    border: 1px dashed rgba(34,211,238,0.3);
    animation: spin 22s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  .node {
    position: absolute;
    transform: translate(-50%, -50%);
    border-radius: 50%;
    background: var(--card);
    border: 2px solid rgba(255,255,255,0.1);
    box-shadow: 0 10px 24px rgba(0,0,0,0.4);
    display: grid;
    place-items: center;
    cursor: pointer;
    z-index: 2;
    transition: transform .22s ease-out, border-color .3s ease, box-shadow .3s ease;
  }
  .node:hover { transform: translate(-50%, -50%) scale(1.1); }
  .node.active {
    border-color: var(--cyan);
    box-shadow: 0 0 22px rgba(34,211,238,0.4), 0 10px 24px rgba(0,0,0,0.4);
  }
  .node.idle { border-color: rgba(255,255,255,0.14); }
  .node.offline { opacity: .45; border-color: rgba(224,64,144,0.35); }

  .ring {
    position: absolute;
    left: 50%;
    top: 50%;
    transform: translate(-50%, -50%);
    border-radius: 50%;
    border: 1px solid rgba(255,255,255,0.05);
    pointer-events: none;
  }

  .grid-bg {
    position: absolute;
    inset: 0;
    pointer-events: none;
    opacity: .35;
  }

  .tooltip {
    position: fixed;
    pointer-events: none;
    background: rgba(11,12,20,0.92);
    border: 1px solid var(--border);
    backdrop-filter: blur(12px);
    border-radius: 12px;
    padding: 10px 12px;
    font-size: 11px;
    line-height: 1.4;
    box-shadow: 0 18px 40px rgba(0,0,0,0.55);
    z-index: 50;
    opacity: 0;
    transition: opacity .12s ease;
  }
  .tooltip.show { opacity: 1; }

  .kpi {
    position: absolute;
    right: 14px;
    bottom: 14px;
    display: flex;
    gap: 8px;
    z-index: 4;
  }
  .kpi span {
    font-size: 10px;
    color: var(--muted);
    background: rgba(19,18,32,0.75);
    border: 1px solid var(--border);
    padding: 5px 9px;
    border-radius: 999px;
    backdrop-filter: blur(10px);
  }
  .kpi .val { color: var(--text); font-weight: 700; }

  @media (max-width: 860px) {
    .grid { grid-template-columns: 1fr; }
  }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation-duration: 0.01ms !important; transition-duration: 0.01ms !important; }
  }
</style>
</head>
<body>
<div class="wrap">
  <div class="header">
    <div>
      <h1>Topology Redesign Competition</h1>
      <p>5 variants in one file — click a card to inspect the layout concept.</p>
    </div>
    <div class="badge">Preview</div>
  </div>

  <div class="grid" id="grid"></div>
</div>

<div class="tooltip" id="tooltip">
  <div style="font-weight:600" id="ttName">Provider</div>
  <div style="color:var(--muted);margin-top:4px" id="ttMeta">0 keys</div>
</div>

<script>
  const providers = [
    { name: "Google", status: "active" },
    { name: "OpenRouter", status: "active" },
    { name: "Anigravity", status: "active" },
    { name: "RunAPI", status: "active" },
    { name: "Xiaomi", status: "idle" },
    { name: "Meta", status: "idle" },
    { name: "DeepSeek", status: "idle" },
    { name: "Groq", status: "offline" },
    { name: "Ollama", status: "idle" },
    { name: "Cloudflare", status: "offline" },
  ];

  const colors = {
    google: "#4285f4",
    openrouter: "#6366f1",
    anigravity: "#f59e0b",
    runapi: "#8b5cf6",
    xiaomi: "#ff6900",
    meta: "#0668e1",
    deepseek: "#0ea5e9",
    groq: "#ef4444",
    ollama: "#10b981",
    cloudflare: "#f48120",
  };

  function providerColor(name) {
    const k = name.toLowerCase();
    for (const [key, value] of Object.entries(colors)) if (k.includes(key)) return value;
    return "#71717a";
  }

  function positionTooltip(e) {
    const tooltip = document.getElementById("tooltip");
    tooltip.style.left = (e.clientX + 14) + "px";
    tooltip.style.top = (e.clientY - 12) + "px";
  }

  function makeNode(container, x, y, size, p, ringCount, variant) {
    const node = document.createElement("div");
    node.className = `node ${p.status}`;
    node.style.left = x + "px";
    node.style.top = y + "px";
    node.style.width = size + "px";
    node.style.height = size + "px";

    const inner = document.createElement("div");
    inner.style.width = "100%";
    inner.style.height = "100%";
    inner.style.borderRadius = "50%";
    inner.style.display = "grid";
    inner.style.placeItems = "center";
    inner.innerHTML = `<div style="font-weight:700;color:${providerColor(p.name)}">${p.name[0]}</div>`;
    node.appendChild(inner);

    node.addEventListener("mouseenter", (e) => {
      const tooltip = document.getElementById("tooltip");
      tooltip.classList.add("show");
      document.getElementById("ttName").textContent = p.name;
      document.getElementById("ttMeta").textContent = `${Math.floor(Math.random()*12)+1} keys · ${p.status.toUpperCase()}`;
      positionTooltip(e);
    });
    node.addEventListener("mousemove", positionTooltip);
    node.addEventListener("mouseleave", () => document.getElementById("tooltip").classList.remove("show"));
    container.appendChild(node);
    return node;
  }

  function drawRing(container, size, ringIndex, totalRings) {
    const ring = document.createElement("div");
    ring.className = "ring";
    ring.style.width = size + "px";
    ring.style.height = size + "px";
    container.appendChild(ring);
  }

  function drawEdges(edgesSvg, nodes, edges, color, dashed = true) {
    edges.forEach(([a, b]) => {
      const line = document.createElementNS("http://www.w3.org/2000/svg", "line");
      line.setAttribute("x1", nodes[a].x);
      line.setAttribute("y1", nodes[a].y);
      line.setAttribute("x2", nodes[b].x);
      line.setAttribute("y2", nodes[b].y);
      line.setAttribute("stroke", color);
      line.setAttribute("stroke-width", "1");
      line.setAttribute("opacity", "0.18");
      if (dashed) line.setAttribute("stroke-dasharray", "5,5");
      edgesSvg.appendChild(line);
    });
  }

  function renderVariantA(container, w, h) {
    const cx = w / 2, cy = h / 2;
    const maxR = Math.min(w, h) * 0.38;
    const count = providers.length;
    const rings = count <= 6 ? 2 : 3;
    const perRing = Array.from({ length: rings }, () => Math.ceil(count / rings));
    let idx = 0;
    const nodes = [];
    for (let r = 0; r < rings; r++) {
      const radius = ((r + 1) / rings) * maxR;
      const n = Math.min(perRing[r], count - idx);
      for (let i = 0; i < n; i++) {
        const angle = (i / n) * Math.PI * 2 - Math.PI / 2;
        nodes.push({ x: cx + Math.cos(angle) * radius, y: cy + Math.sin(angle) * radius, provider: providers[idx] });
        idx++;
      }
    }
    while (nodes.length < count) {
      const angle = Math.random() * Math.PI * 2;
      const radius = Math.random() * maxR;
      nodes.push({ x: cx + Math.cos(angle) * radius, y: cy + Math.sin(angle) * radius, provider: providers[idx] });
      idx++;
    }

    const svg = document.createElementNS("http://www.w3.org/2000/svg", "svg");
    svg.setAttribute("width", w);
    svg.setAttribute("height", h);
    svg.style.position = "absolute";
    svg.style.inset = "0";
    svg.style.pointerEvents = "none";
    svg.style.zIndex = "1";

    for (let i = 0; i < nodes.length; i++) {
      const line = document.createElementNS("http://www.w3.org/2000/svg", "line");
      line.setAttribute("x1", cx);
      line.setAttribute("y1", cy);
      line.setAttribute("x2", nodes[i].x);
      line.setAttribute("y2", nodes[i].y);
      line.setAttribute("stroke", "rgba(34,211,238,0.12)");
      line.setAttribute("stroke-width", "1");
      line.setAttribute("stroke-dasharray", "5,5");
      svg.appendChild(line);
    }
    container.appendChild(svg);

    [0.28, 0.55, 0.82].forEach((scale, i) => drawRing(container, Math.min(w, h) * scale, i, 3));
    const centerMark = document.createElement("div");
    centerMark.className = "center-mark";
    centerMark.innerHTML = `<svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="var(--cyan)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10" /><path d="M12 2a14.5 14.5 0 0 0 0 20" /><path d="M2 12h20" /></svg>`;
    container.appendChild(centerMark);

    nodes.forEach((n) => makeNode(container, n.x, n.y, 56, n.provider, 3, "a"));

    const stats = document.createElement("div");
    stats.className = "kpi";
    const active = providers.filter((p) => p.status === "active").length;
    stats.innerHTML = `<span>Providers <span class="val">${providers.length}</span></span><span>Active <span class="val">${active}</span></span><span>Load <span class="val">${Math.round((active / providers.length) * 100)}%</span></span>`;
    container.appendChild(stats);
  }

  function renderVariantB(container, w, h) {
    const cx = w / 2, cy = h / 2;
    const maxR = Math.min(w, h) * 0.4;
    const nodes = [];
    const goldenAngle = Math.PI * (3 - Math.sqrt(5));
    providers.forEach((p, i) => {
      const angle = i * goldenAngle;
      const radius = Math.sqrt((i + 1) / providers.length) * maxR;
      nodes.push({ x: cx + Math.cos(angle) * radius, y: cy + Math.sin(angle) * radius, provider: p });
    });

    const svg = document.createElementNS("http://www.w3.org/2000/svg", "svg");
    svg.setAttribute("width", w);
    svg.setAttribute("height", h);
    svg.style.position = "absolute";
    svg.style.inset = "0";
    svg.style.pointerEvents = "none";
    svg.style.zIndex = "1";

    const edges = [];
    for (let i = 0; i < nodes.length; i++) {
      const dists = nodes.map((n, j) => ({ j, d: Math.hypot(n.x - nodes[i].x, n.y - nodes[i].y) }))
        .sort((a, b) => a.d - b.d)
        .slice(1, 4);
      dists.forEach((k) => { if (k.d < Math.min(180, nodes.length * 18)) edges.push([i, k.j]); });
    }
    drawEdges(svg, nodes, edges, "rgba(34,211,238,0.14)");

    nodes.forEach((n) => makeNode(container, n.x, n.y, 52, n.provider, 0, "b"));

    const stats = document.createElement("div");
    stats.className = "kpi";
    const active = providers.filter((p) => p.status === "active").length;
    stats.innerHTML = `<span>Providers <span class="val">${providers.length}</span></span><span>Active <span class="val">${active}</span></span><span>Load <span class="val">${Math.round((active / providers.length) * 100)}%</span></span>`;
    container.appendChild(stats);
  }

  function renderVariantC(container, w, h) {
    const cols = 5;
    const rows = 2;
    const cellW = (w - 70) / cols;
    const cellH = (h - 70) / rows;
    const nodes = [];
    providers.forEach((p, i) => {
      const col = i % cols;
      const row = Math.floor(i / cols);
      const offsetX = row % 2 === 1 ? cellW / 2 : 0;
      nodes.push({ x: 35 + col * cellW + offsetX + cellW / 2, y: 35 + row * cellH + cellH / 2, provider: p });
    });

    const svg = document.createElementNS("http://www.w3.org/2000/svg", "svg");
    svg.setAttribute("width", w);
    svg.setAttribute("height", h);
    svg.style.position = "absolute";
    svg.style.inset = "0";
    svg.style.pointerEvents = "none";
    svg.style.zIndex = "1";

    const edges = [];
    for (let i = 0; i < nodes.length; i++) {
      const col = i % cols;
      const row = Math.floor(i / cols);
      if (col + 1 < cols && i + 1 < nodes.length) edges.push([i, i + 1]);
      if (i + cols < nodes.length) edges.push([i, i + cols]);
      if (row % 2 === 0 && col > 0 && i + cols - 1 < nodes.length) edges.push([i, i + cols - 1]);
      if (row % 2 === 1 && col + 1 < cols && i + cols + 1 < nodes.length) edges.push([i, i + cols + 1]);
    }
    drawEdges(svg, nodes, edges, "rgba(34,211,238,0.16)");

    nodes.forEach((n) => makeNode(container, n.x, n.y, 46, n.provider, 0, "c"));

    const stats = document.createElement("div");
    stats.className = "kpi";
    const active = providers.filter((p) => p.status === "active").length;
    stats.innerHTML = `<span>Providers <span class="val">${providers.length}</span></span><span>Active <span class="val">${active}</span></span><span>Load <span class="val">${Math.round((active / providers.length) * 100)}%</span></span>`;
    container.appendChild(stats);
  }

  function renderVariantD(container, w, h) {
    const cx = w / 2, cy = h / 2;
    const maxR = Math.min(w, h) * 0.36;
    const nodes = [];
    const arms = 3;
    const nodesPerArm = Math.ceil(providers.length / arms);
    providers.forEach((p, i) => {
      const arm = i % arms;
      const pos = Math.floor(i / arms);
      const angle = (arm / arms) * Math.PI * 2 + (pos / nodesPerArm) * Math.PI * 1.6;
      const radius = 28 + (pos / nodesPerArm) * maxR;
      nodes.push({ x: cx + Math.cos(angle) * radius, y: cy + Math.sin(angle) * radius, provider: p });
    });

    const svg = document.createElementNS("http://www.w3.org/2000/svg", "svg");
    svg.setAttribute("width", w);
    svg.setAttribute("height", h);
    svg.style.position = "absolute";
    svg.style.inset = "0";
    svg.style.pointerEvents = "none";
    svg.style.zIndex = "1";

    providers.forEach((_, i) => {
      if (i + arms < nodes.length) {
        const line = document.createElementNS("http://www.w3.org/2000/svg", "line");
        line.setAttribute("x1", nodes[i].x);
        line.setAttribute("y1", nodes[i].y);
        line.setAttribute("x2", nodes[i + arms].x);
        line.setAttribute("y2", nodes[i + arms].y);
        line.setAttribute("stroke", "rgba(34,211,238,0.14)");
        line.setAttribute("stroke-width", "1");
        line.setAttribute("stroke-dasharray", "6,6");
        svg.appendChild(line);
      }
    });

    nodes.forEach((n) => makeNode(container, n.x, n.y, 50, n.provider, 0, "d"));

    const stats = document.createElement("div");
    stats.className = "kpi";
    const active = providers.filter((p) => p.status === "active").length;
    stats.innerHTML = `<span>Providers <span class="val">${providers.length}</span></span><span>Active <span class="val">${active}</span></span><span>Load <span class="val">${Math.round((active / providers.length) * 100)}%</span></span>`;
    container.appendChild(stats);
  }

  function renderVariantE(container, w, h) {
    const cx = w / 2, cy = h / 2;
    const maxR = Math.min(w, h) * 0.38;
    const layers = 3;
    const nodes = [];
    const perLayer = Math.ceil(providers.length / layers);
    providers.forEach((p, i) => {
      const layer = Math.floor(i / perLayer);
      const pos = i % perLayer;
      const countInLayer = Math.min(perLayer, providers.length - layer * perLayer);
      const nodeH = (h - 80) / (countInLayer + 1);
      nodes.push({ x: 50 + (layer + 1) * ((w - 100) / (layers + 1)), y: 40 + (pos + 1) * nodeH, provider: p, layer });
    });

    const svg = document.createElementNS("http://www.w3.org/2000/svg", "svg");
    svg.setAttribute("width", w);
    svg.setAttribute("height", h);
    svg.style.position = "absolute";
    svg.style.inset = "0";
    svg.style.pointerEvents = "none";
    svg.style.zIndex = "1";

    for (let i = 0; i < nodes.length; i++) {
      const layer = nodes[i].layer;
      const nextStart = (layer + 1) * perLayer;
      for (let j = nextStart; j < Math.min(nextStart + perLayer, nodes.length); j++) {
        const line = document.createElementNS("http://www.w3.org/2000/svg", "line");
        line.setAttribute("x1", nodes[i].x);
        line.setAttribute("y1", nodes[i].y);
        line.setAttribute("x2", nodes[j].x);
        line.setAttribute("y2", nodes[j].y);
        line.setAttribute("stroke", "rgba(34,211,238,0.14)");
        line.setAttribute("stroke-width", "1");
        line.setAttribute("stroke-dasharray", "4,6");
        svg.appendChild(line);
      }
    }

    nodes.forEach((n) => makeNode(container, n.x, n.y, 48, n.provider, 0, "e"));

    const stats = document.createElement("div");
    stats.className = "kpi";
    const active = providers.filter((p) => p.status === "active").length;
    stats.innerHTML = `<span>Providers <span class="val">${providers.length}</span></span><span>Active <span class="val">${active}</span></span><span>Load <span class="val">${Math.round((active / providers.length) * 100)}%</span></span>`;
    container.appendChild(stats);
  }

  const variants = [
    { name: "Hub & Spoke", desc: "Providers orbit the center hub with direct spoke lines. Strong focal point, easy scan, good for action-first dashboards.", tags: ["Center-first", "Routing feel", "Compact status"] },
    { name: "Photon Cloud", desc: "Golden-angle scatter with soft nearest-neighbor links. Feels organic and data-backed, less obviously structural.", tags: ["Organic", "Sparse links", "Diffuse"] },
    { name: "Hex Grid", desc: "Ordered honeycomb with cell neighbors. Best when provider count is fixed and you want tight visual order.", tags: ["Structured", "Predictable", "Grid-native"] },
    { name: "Spiral Arms", desc: "Three-arm galaxy with grouped progression. Good if you want to imply groups, priority lanes, or traffic flow.", tags: ["Directional", "Grouped", "Dynamic"] },
    { name: "Neural Pipeline", desc: "Layered left-to-right flow with cross-layer edges. Reads as a processing path rather than a map.", tags: ["Flow-based", "Sequential", "Backend-ish"] },
  ];

  const grid = document.getElementById("grid");
  variants.forEach((v, idx) => {
    const card = document.createElement("div");
    card.className = "variant";
    const stage = document.createElement("div");
    stage.className = "stage";

    const legend = document.createElement("div");
    legend.className = "legend";
    legend.innerHTML = `<span><span class="dot"></span> Active</span><span><span class="dot idle"></span> Idle</span><span><span class="dot offline"></span> Offline</span>`;
    stage.appendChild(legend);

    const title = document.createElement("div");
    title.className = "title";
    title.innerHTML = `<h2>${v.name}</h2><p>${String(idx + 1).padStart(2, "0")} / 05</p>`;
    stage.appendChild(title);

    card.appendChild(stage);

    const meta = document.createElement("div");
    meta.className = "meta";
    meta.innerHTML = `<div class="name">${v.name}</div><div class="desc">${v.desc}</div><div class="tags">${v.tags.map((t) => `<span class="tag">${t}</span>`).join("")}</div>`;
    card.appendChild(meta);
    grid.appendChild(card);

    const render = () => {
      const rect = stage.getBoundingClientRect();
      const w = rect.width, h = rect.height;
      stage.querySelectorAll(".node, .ring, .center-mark, svg, .kpi").forEach((el) => el.remove());
      if (idx === 0) renderVariantA(stage, w, h);
      else if (idx === 1) renderVariantB(stage, w, h);
      else if (idx === 2) renderVariantC(stage, w, h);
      else if (idx === 3) renderVariantD(stage, w, h);
      else renderVariantE(stage, w, h);
    };
    window.addEventListener("resize", render);
    setTimeout(render, 0);
  });
</script>
</body>
</html>
