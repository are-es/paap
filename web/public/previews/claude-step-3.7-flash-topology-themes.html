<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>PAAP Topology — 5 Themed Variants</title>
<style>
  *, *::before, *::after { box-sizing: border-box; }
  html, body { margin: 0; min-height: 100vh; font-family: system-ui, sans-serif; }

  /* ===== THEME ENGINE ===== */
  :root {
    --t-bg: #0b0c14;
    --t-surface: #131420;
    --t-border: rgba(255,255,255,0.08);
    --t-text: #e6e8ef;
    --t-muted: #8a8fa6;
    --t-accent: #22d3ee;
    --t-node-bg: #131420;
    --t-node-border: rgba(255,255,255,0.1);
    --t-line: rgba(34,211,238,0.14);
    --t-font: system-ui;
    --t-radius: 50%;
    --t-grid: 1px;
    --t-grid-color: rgba(255,255,255,0.04);
    --t-center-border: rgba(34,211,238,0.35);
    --t-center-glow: rgba(34,211,238,0.2);
    --t-ring-color: rgba(255,255,255,0.05);
  }

  /* ── THEME 1: Orbital ── dark space, cyan, sans-serif */
  [data-theme="orbital"] {
    --t-bg: #0b0c14;
    --t-surface: #131420;
    --t-border: rgba(255,255,255,0.08);
    --t-text: #e6e8ef;
    --t-muted: #8a8fa6;
    --t-accent: #22d3ee;
    --t-node-bg: #131420;
    --t-node-border: rgba(255,255,255,0.1);
    --t-line: rgba(34,211,238,0.14);
    --t-font: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif;
    --t-radius: 50%;
    --t-center-border: rgba(34,211,238,0.35);
    --t-center-glow: rgba(34,211,238,0.2);
    --t-ring-color: rgba(255,255,255,0.05);
  }

  /* ── THEME 2: Terminal ── black/green, monospace, hacker */
  [data-theme="terminal"] {
    --t-bg: #0a0f0a;
    --t-surface: #0d140d;
    --t-border: rgba(0,255,65,0.12);
    --t-text: #c8ffc8;
    --t-muted: #4a7a4a;
    --t-accent: #00ff41;
    --t-node-bg: #0a0f0a;
    --t-node-border: rgba(0,255,65,0.2);
    --t-line: rgba(0,255,65,0.12);
    --t-font: 'Courier New', Courier, monospace;
    --t-radius: 2px;
    --t-center-border: rgba(0,255,65,0.4);
    --t-center-glow: rgba(0,255,65,0.15);
    --t-ring-color: rgba(0,255,65,0.06);
  }

  /* ── THEME 3: Blueprint ── white/blue, technical, no radius */
  [data-theme="blueprint"] {
    --t-bg: #1a2a4a;
    --t-surface: #1e3560;
    --t-border: rgba(100,180,255,0.15);
    --t-text: #d8e8ff;
    --t-muted: #6a8ab0;
    --t-accent: #4fc3f7;
    --t-node-bg: #1e3560;
    --t-node-border: rgba(100,180,255,0.25);
    --t-line: rgba(100,180,255,0.18);
    --t-font: 'Courier New', Courier, monospace;
    --t-radius: 0px;
    --t-center-border: rgba(100,180,255,0.5);
    --t-center-glow: rgba(100,180,255,0.12);
    --t-ring-color: rgba(100,180,255,0.08);
    --t-grid-color: rgba(100,180,255,0.1);
  }

  /* ── THEME 4: Obsidian Gold ── dark, serif, gold accents */
  [data-theme="obsidian"] {
    --t-bg: #0f0e0a;
    --t-surface: #1a1710;
    --t-border: rgba(200,155,50,0.1);
    --t-text: #f5efe0;
    --t-muted: #7a6e58;
    --t-accent: #d4a543;
    --t-node-bg: #1a1710;
    --t-node-border: rgba(200,155,50,0.22);
    --t-line: rgba(200,155,50,0.13);
    --t-font: 'Georgia', 'Times New Roman', Times, serif;
    --t-radius: 50%;
    --t-center-border: rgba(200,155,50,0.4);
    --t-center-glow: rgba(200,155,50,0.12);
    --t-ring-color: rgba(200,155,50,0.05);
  }

  /* ── THEME 5: Circuit ── dark PCB, cyan/green traces, square-ish nodes */
  [data-theme="circuit"] {
    --t-bg: #080c0a;
    --t-surface: #0e1410;
    --t-border: rgba(80,220,120,0.1);
    --t-text: #c8ffe8;
    --t-muted: #3a6a50;
    --t-accent: #50dc78;
    --t-node-bg: #0e1410;
    --t-node-border: rgba(80,220,120,0.25);
    --t-line: rgba(80,220,120,0.14);
    --t-font: 'Courier New', Courier, monospace;
    --t-radius: 4px;
    --t-center-border: rgba(80,220,120,0.45);
    --t-center-glow: rgba(80,220,120,0.15);
    --t-ring-color: rgba(80,220,120,0.06);
  }

  /* ===== LAYOUT ===== */
  body { background: var(--t-bg); color: var(--t-text); font-family: var(--t-font); transition: background .4s, color .4s; }
  .wrap { max-width: 1180px; margin: 0 auto; padding: 28px 20px 80px; }

  .header { display: flex; align-items: end; justify-content: space-between; gap: 16px; margin-bottom: 20px; }
  .header h1 { margin: 0; font-size: 17px; font-weight: 700; letter-spacing: .05em; font-family: var(--t-font); }
  .header p { margin: 6px 0 0; color: var(--t-muted); font-size: 12px; }

  .switcher { display: flex; gap: 8px; flex-wrap: wrap; }
  .sw-btn {
    font-family: var(--t-font);
    font-size: 11px;
    font-weight: 600;
    letter-spacing: .06em;
    text-transform: uppercase;
    padding: 8px 14px;
    border-radius: 8px;
    border: 1px solid var(--t-border);
    background: var(--t-surface);
    color: var(--t-muted);
    cursor: pointer;
    transition: all .2s ease;
  }
  .sw-btn:hover { border-color: var(--t-accent); color: var(--t-text); }
  .sw-btn.active { background: var(--t-accent); color: var(--t-bg); border-color: var(--t-accent); box-shadow: 0 0 18px var(--t-accent); }

  .grid { display: grid; grid-template-columns: 1fr; gap: 20px; }

  .variant {
    border: 1px solid var(--t-border);
    border-radius: 22px;
    overflow: hidden;
    background: var(--t-surface);
    transition: border-color .3s;
  }
  .variant.active { border-color: var(--t-accent); box-shadow: 0 0 30px color-mix(in srgb, var(--t-accent) 20%, transparent); }

  .stage {
    position: relative;
    width: 100%;
    aspect-ratio: 16 / 9;
    overflow: hidden;
    background-image:
      linear-gradient(var(--t-grid-color) 1px, transparent 1px),
      linear-gradient(90deg, var(--t-grid-color) 1px, transparent 1px);
    background-size: 28px 28px;
  }

  .variant > .meta {
    padding: 14px 18px;
    border-top: 1px solid var(--t-border);
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  .meta .name { font-size: 13px; font-weight: 700; letter-spacing: .05em; font-family: var(--t-font); }
  .meta .desc { margin: 4px 0 0; font-size: 11px; color: var(--t-muted); line-height: 1.45; }
  .meta .tags { margin-top: 8px; display: flex; gap: 6px; flex-wrap: wrap; }
  .tag { font-size: 10px; font-family: var(--t-font); color: var(--t-muted); border: 1px solid var(--t-border); padding: 3px 8px; border-radius: 999px; }

  .legend {
    position: absolute; left: 14px; top: 14px; display: flex; gap: 10px; z-index: 4;
  }
  .legend span {
    display: inline-flex; align-items: center; gap: 6px; font-size: 10px; font-family: var(--t-font);
    color: var(--t-muted); background: color-mix(in srgb, var(--t-surface) 75%, transparent);
    border: 1px solid var(--t-border); padding: 5px 9px; border-radius: 999px;
  }
  .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--t-accent); box-shadow: 0 0 7px var(--t-accent); }
  .dot.idle { background: var(--t-muted); box-shadow: none; }
  .dot.offline { background: #e04090; opacity: .6; box-shadow: none; }

  .title { position: absolute; right: 14px; top: 14px; z-index: 4; text-align: right; }
  .title h2 { margin: 0; font-size: 12px; font-weight: 700; letter-spacing: .08em; font-family: var(--t-font); }
  .title p { margin: 3px 0 0; font-size: 10px; color: var(--t-muted); }

  .center-hub {
    position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%);
    width: 80px; height: 80px; border-radius: var(--t-radius);
    background: var(--t-surface);
    border: 2px solid var(--t-center-border);
    box-shadow: 0 0 24px var(--t-center-glow), inset 0 0 14px var(--t-center-glow);
    display: grid; place-items: center; z-index: 3;
  }
  .center-hub::after {
    content: ""; position: absolute; inset: -14px; border-radius: var(--t-radius);
    border: 1px dashed var(--t-center-border);
    animation: spin 22s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  .node {
    position: absolute; transform: translate(-50%, -50%);
    width: 52px; height: 52px; border-radius: var(--t-radius);
    background: var(--t-node-bg);
    border: 2px solid var(--t-node-border);
    box-shadow: 0 10px 22px rgba(0,0,0,0.4);
    display: grid; place-items: center; cursor: pointer;
    z-index: 2; transition: transform .2s ease-out, border-color .3s ease, box-shadow .3s ease;
  }
  .node:hover { transform: translate(-50%, -50%) scale(1.1); }
  .node.active { border-color: var(--t-accent); box-shadow: 0 0 22px color-mix(in srgb, var(--t-accent) 35%, transparent), 0 10px 22px rgba(0,0,0,0.4); }
  .node.idle { border-color: rgba(255,255,255,0.14); }
  .node.offline { opacity: .45; border-color: rgba(224,64,144,0.3); }

  .ring { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); border-radius: var(--t-radius); border: 1px solid var(--t-ring-color); pointer-events: none; }

  svg.lines { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 1; }

  .kpi { position: absolute; right: 14px; bottom: 14px; display: flex; gap: 8px; z-index: 4; }
  .kpi span { font-size: 10px; font-family: var(--t-font); color: var(--t-muted); background: color-mix(in srgb, var(--t-surface) 75%, transparent); border: 1px solid var(--t-border); padding: 5px 9px; border-radius: 999px; }
  .kpi .val { color: var(--t-text); font-weight: 700; }

  .tooltip {
    position: fixed; pointer-events: none;
    background: color-mix(in srgb, var(--t-surface) 92%, var(--t-bg));
    border: 1px solid var(--t-border); border-radius: 10px;
    padding: 10px 12px; font-size: 11px; font-family: var(--t-font);
    line-height: 1.4; box-shadow: 0 18px 40px rgba(0,0,0,0.55); z-index: 50;
    opacity: 0; transition: opacity .12s ease;
  }
  .tooltip.show { opacity: 1; }

  /* Theme-specific extras */
  [data-theme="terminal"] .center-hub { border-radius: 2px; }
  [data-theme="terminal"] .node { border-radius: 2px; }
  [data-theme="terminal"] .center-hub::after { border-radius: 2px; }

  [data-theme="blueprint"] .center-hub { border-radius: 0; }
  [data-theme="blueprint"] .node { border-radius: 0; }
  [data-theme="blueprint"] .center-hub::after { border-radius: 0; }

  [data-theme="circuit"] .node { border-radius: 4px; }
  [data-theme="circuit"] .center-hub { border-radius: 4px; }
  [data-theme="circuit"] .center-hub::after { border-radius: 4px; }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation-duration: 0.01ms !important; transition-duration: 0.01ms !important; }
  }
  @media (max-width: 700px) { .switcher { gap: 6px; } .sw-btn { padding: 6px 10px; font-size: 10px; } }
</style>
</head>
<body data-theme="orbital">
<div class="wrap">
  <div class="header">
    <div>
      <h1>Topology Redesign — Themed Variants</h1>
      <p>5 completely different visual directions. Switch to compare.</p>
    </div>
  </div>
  <div class="switcher" id="switcher"></div>
  <div class="grid" id="grid"></div>
</div>
<div class="tooltip" id="tooltip">
  <div style="font-weight:600" id="ttName">Provider</div>
  <div style="color:var(--t-muted);margin-top:4px" id="ttMeta">0 keys</div>
</div>

<script>
  const providers = [
    { name: "Google",     status: "active"  },
    { name: "OpenRouter", status: "active"  },
    { name: "Anigravity", status: "active"  },
    { name: "RunAPI",     status: "active"  },
    { name: "Xiaomi",     status: "idle"    },
    { name: "Meta",       status: "idle"    },
    { name: "DeepSeek",   status: "idle"    },
    { name: "Groq",       status: "offline" },
    { name: "Ollama",     status: "idle"    },
    { name: "Cloudflare", status: "offline" },
  ];

  const colors = {
    google: "#4285f4", openrouter: "#6366f1", anigravity: "#f59e0b",
    runapi: "#8b5cf6", xiaomi: "#ff6900", meta: "#0668e1",
    deepseek: "#0ea5e9", groq: "#ef4444", ollama: "#10b981", cloudflare: "#f48120",
  };
  function providerColor(name) {
    const k = name.toLowerCase();
    for (const [key, value] of Object.entries(colors)) if (k.includes(key)) return value;
    return "#71717a";
  }

  const variants = [
    {
      id: "orbital",
      label: "Orbital",
      desc: "Dark space, cyan accents, concentric rings. Clean, confident, familiar.",
      tags: ["Dark", "Cyan", "Sans-serif", "Rounded"],
    },
    {
      id: "terminal",
      label: "Terminal",
      desc: "Black/green phosphor, monospace, sharp corners. Feels like ops console.",
      tags: ["Hacker", "Green", "Monospace", "Sharp"],
    },
    {
      id: "blueprint",
      label: "Blueprint",
      desc: "Navy/blue technical sheet, square nodes, grid lines. Engineering aesthetic.",
      tags: ["Technical", "Blue", "Monospace", "Square"],
    },
    {
      id: "obsidian",
      label: "Obsidian",
      desc: "Warm dark with gold leaf, serif headings. Feels premium and controlled.",
      tags: ["Luxury", "Gold", "Serif", "Warm"],
    },
    {
      id: "circuit",
      label: "Circuit",
      desc: "PCB-inspired with trace-like connections, square-ish nodes. Technical and distinctive.",
      tags: ["PCB", "Green-cyan", "Mono", "Angular"],
    },
  ];

  /* ===== SWITCHER ===== */
  const switcherEl = document.getElementById("switcher");
  variants.forEach((v) => {
    const btn = document.createElement("button");
    btn.className = "sw-btn" + (v.id === "orbital" ? " active" : "");
    btn.textContent = v.label;
    btn.addEventListener("click", () => {
      document.querySelectorAll(".sw-btn").forEach(b => b.classList.remove("active"));
      document.querySelectorAll(".variant").forEach(c => c.classList.remove("active"));
      btn.classList.add("active");
      document.querySelector(`.variant[data-id="${v.id}"]`)?.classList.add("active");
      document.body.setAttribute("data-theme", v.id);
    });
    switcherEl.appendChild(btn);
  });

  /* ===== RENDER ENGINE ===== */
  function positionTooltip(e) {
    const tooltip = document.getElementById("tooltip");
    tooltip.style.left = (e.clientX + 14) + "px";
    tooltip.style.top = (e.clientY - 12) + "px";
  }

  function mkNode(parent, x, y, p) {
    const n = document.createElement("div");
    n.className = `node ${p.status}`;
    n.style.left = x + "px"; n.style.top = y + "px";
    n.innerHTML = `<div style="font-weight:700;font-size:14px;color:${providerColor(p.name)};font-family:var(--t-font)">${p.name[0]}</div>`;
    n.addEventListener("mouseenter", (e) => {
      const tt = document.getElementById("tooltip");
      tt.classList.add("show");
      document.getElementById("ttName").textContent = p.name;
      document.getElementById("ttMeta").textContent = `${Math.floor(Math.random()*12)+1} keys · ${p.status.toUpperCase()}`;
      positionTooltip(e);
    });
    n.addEventListener("mousemove", positionTooltip);
    n.addEventListener("mouseleave", () => document.getElementById("tooltip").classList.remove("show"));
    parent.appendChild(n);
  }

  function mkRing(parent, size) {
    const r = document.createElement("div");
    r.className = "ring"; r.style.width = size + "px"; r.style.height = size + "px";
    parent.appendChild(r);
  }

  function mkCenterHub(parent) {
    const hub = document.createElement("div");
    hub.className = "center-hub";
    hub.innerHTML = `<svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="var(--t-accent)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M12 2a14.5 14.5 0 0 0 0 20"/><path d="M2 12h20"/></svg>`;
    parent.appendChild(hub);
  }

  function mkKPI(parent) {
    const active = providers.filter(p => p.status === "active").length;
    const k = document.createElement("div");
    k.className = "kpi";
    k.innerHTML = `<span>Providers <span class="val">${providers.length}</span></span><span>Active <span class="val">${active}</span></span><span>Load <span class="val">${Math.round(active/providers.length*100)}%</span></span>`;
    parent.appendChild(k);
  }

  function mkLegend(parent) {
    const l = document.createElement("div");
    l.className = "legend";
    l.innerHTML = `<span><span class="dot"></span>Active</span><span><span class="dot idle"></span>Idle</span><span><span class="dot offline"></span>Offline</span>`;
    parent.appendChild(l);
  }

  function mkTitle(parent, name, idx) {
    const t = document.createElement("div");
    t.className = "title";
    t.innerHTML = `<h2>${name}</h2><p>${String(idx+1).padStart(2,"0")} / 05</p>`;
    parent.appendChild(t);
  }

  function mkSvg(parent, w, h) {
    const s = document.createElementNS("http://www.w3.org/2000/svg", "svg");
    s.setAttribute("width", w); s.setAttribute("height", h);
    s.className = "lines"; s.style.position = "absolute"; s.style.inset = "0";
    s.style.pointerEvents = "none"; s.style.zIndex = "1";
    parent.appendChild(s);
    return s;
  }

  function drawLines(svg, lines) {
    lines.forEach(([x1,y1,x2,y2]) => {
      const l = document.createElementNS("http://www.w3.org/2000/svg", "line");
      l.setAttribute("x1", x1); l.setAttribute("y1", y1);
      l.setAttribute("x2", x2); l.setAttribute("y2", y2);
      l.setAttribute("stroke", "var(--t-line)");
      l.setAttribute("stroke-width", "1");
      l.setAttribute("stroke-dasharray", "5,5");
      svg.appendChild(l);
    });
  }

  /* ── LAYOUT 1: Hub & Spoke ── */
  function layoutHubSpoke(stage, w, h) {
    const cx = w/2, cy = h/2, maxR = Math.min(w,h)*0.38;
    const rings = providers.length <= 6 ? 2 : 3;
    const perRing = Array.from({length: rings}, () => Math.ceil(providers.length/rings));
    let idx = 0;
    const nodes = [];
    for (let r = 0; r < rings; r++) {
      const radius = ((r+1)/rings)*maxR;
      const n = Math.min(perRing[r], providers.length-idx);
      for (let i = 0; i < n; i++) {
        const a = (i/n)*Math.PI*2 - Math.PI/2;
        nodes.push({ x: cx+Math.cos(a)*radius, y: cy+Math.sin(a)*radius, p: providers[idx] });
        idx++;
      }
    }
    mkSvg(stage, w, h);
    // spokes to center
    const svg = stage.querySelector("svg.lines");
    nodes.forEach(n => {
      const l = document.createElementNS("http://www.w3.org/2000/svg", "line");
      l.setAttribute("x1", cx); l.setAttribute("y1", cy);
      l.setAttribute("x2", n.x); l.setAttribute("y2", n.y);
      l.setAttribute("stroke", "var(--t-line)"); l.setAttribute("stroke-width", "1");
      l.setAttribute("stroke-dasharray", "5,5");
      svg.appendChild(l);
    });
    [0.28,0.55,0.82].forEach(s => mkRing(stage, Math.min(w,h)*s));
    mkCenterHub(stage);
    nodes.forEach(n => mkNode(stage, n.x, n.y, n.p));
    mkKPI(stage);
  }

  /* ── LAYOUT 2: Golden Cloud ── */
  function layoutGoldenCloud(stage, w, h) {
    const cx = w/2, cy = h/2, maxR = Math.min(w,h)*0.4;
    const golden = Math.PI*(3-Math.sqrt(5));
    const nodes = providers.map((p,i) => {
      const a = i*golden;
      const r = Math.sqrt((i+1)/providers.length)*maxR;
      return { x: cx+Math.cos(a)*r, y: cy+Math.sin(a)*r, p };
    });
    const svg = mkSvg(stage,w,h);
    const lines = [];
    for (let i=0; i<nodes.length; i++) {
      const dists = nodes.map((n,j)=>({j,d:Math.hypot(n.x-nodes[i].x,n.y-nodes[i].y)}))
        .sort((a,b)=>a.d-b.d).slice(1,4);
      dists.forEach(k => { if(k.d < Math.min(180,nodes.length*18)) lines.push([nodes[i].x,nodes[i].y,nodes[k.j].x,nodes[k.j].y]); });
    }
    drawLines(svg, lines);
    nodes.forEach(n => mkNode(stage, n.x, n.y, n.p));
    mkKPI(stage);
  }

  /* ── LAYOUT 3: Hex Grid ── */
  function layoutHexGrid(stage, w, h) {
    const cols = 5, rows = 2;
    const cellW = (w-70)/cols, cellH = (h-70)/rows;
    const nodes = providers.map((p,i) => {
      const col = i%cols, row = Math.floor(i/cols);
      const off = row%2===1 ? cellW/2 : 0;
      return { x: 35+col*cellW+off+cellW/2, y: 35+row*cellH+cellH/2, p };
    });
    const svg = mkSvg(stage,w,h);
    const lines = [];
    for (let i=0; i<nodes.length; i++) {
      const col = i%cols, row = Math.floor(i/cols);
      if(col+1<cols && i+1<nodes.length) lines.push([nodes[i].x,nodes[i].y,nodes[i+1].x,nodes[i+1].y]);
      if(i+cols<nodes.length) lines.push([nodes[i].x,nodes[i].y,nodes[i+cols].x,nodes[i+cols].y]);
      if(row%2===0 && col>0 && i+cols-1<nodes.length) lines.push([nodes[i].x,nodes[i].y,nodes[i+cols-1].x,nodes[i+cols-1].y]);
      if(row%2===1 && col+1<cols && i+cols+1<nodes.length) lines.push([nodes[i].x,nodes[i].y,nodes[i+cols+1].x,nodes[i+cols+1].y]);
    }
    drawLines(svg, lines);
    nodes.forEach(n => mkNode(stage, n.x, n.y, n.p));
    mkKPI(stage);
  }

  /* ── LAYOUT 4: Spiral Arms ── */
  function layoutSpiralArms(stage, w, h) {
    const cx=w/2, cy=h/2, maxR=Math.min(w,h)*0.36;
    const arms=3, nodesPerArm=Math.ceil(providers.length/arms);
    const nodes = providers.map((p,i) => {
      const arm=i%arms, pos=Math.floor(i/arms);
      const a=(arm/arms)*Math.PI*2+(pos/nodesPerArm)*Math.PI*1.6;
      const r=28+(pos/nodesPerArm)*maxR;
      return { x:cx+Math.cos(a)*r, y:cy+Math.sin(a)*r, p };
    });
    const svg = mkSvg(stage,w,h);
    providers.forEach((_,i) => {
      if(i+arms < nodes.length) {
        const l = document.createElementNS("http://www.w3.org/2000/svg","line");
        l.setAttribute("x1",nodes[i].x); l.setAttribute("y1",nodes[i].y);
        l.setAttribute("x2",nodes[i+arms].x); l.setAttribute("y2",nodes[i+arms].y);
        l.setAttribute("stroke","var(--t-line)"); l.setAttribute("stroke-width","1");
        l.setAttribute("stroke-dasharray","6,6");
        svg.appendChild(l);
      }
    });
    nodes.forEach(n => mkNode(stage, n.x, n.y, n.p));
    mkKPI(stage);
  }

  /* ── LAYOUT 5: Neural Pipeline ── */
  function layoutNeural(stage, w, h) {
    const layers=3, perLayer=Math.ceil(providers.length/layers);
    const nodes = providers.map((p,i) => {
      const layer=Math.floor(i/perLayer), pos=i%perLayer;
      const countInLayer=Math.min(perLayer,providers.length-layer*perLayer);
      const nodeH=(h-80)/(countInLayer+1);
      return { x:50+(layer+1)*((w-100)/(layers+1)), y:40+(pos+1)*nodeH, p, layer };
    });
    const svg = mkSvg(stage,w,h);
    for (let i=0; i<nodes.length; i++) {
      const layer=nodes[i].layer, nextStart=(layer+1)*perLayer;
      for (let j=nextStart; j<Math.min(nextStart+perLayer,nodes.length); j++) {
        const l = document.createElementNS("http://www.w3.org/2000/svg","line");
        l.setAttribute("x1",nodes[i].x); l.setAttribute("y1",nodes[i].y);
        l.setAttribute("x2",nodes[j].x); l.setAttribute("y2",nodes[j].y);
        l.setAttribute("stroke","var(--t-line)"); l.setAttribute("stroke-width","1");
        l.setAttribute("stroke-dasharray","4,6");
        svg.appendChild(l);
      }
    }
    nodes.forEach(n => mkNode(stage, n.x, n.y, n.p));
    mkKPI(stage);
  }

  const layoutFns = [layoutHubSpoke, layoutGoldenCloud, layoutHexGrid, layoutSpiralArms, layoutNeural];

  /* ===== BUILD CARDS ===== */
  const grid = document.getElementById("grid");
  variants.forEach((v, idx) => {
    const card = document.createElement("div");
    card.className = "variant" + (idx===0 ? " active" : "");
    card.setAttribute("data-id", v.id);

    const stage = document.createElement("div");
    stage.className = "stage";
    mkLegend(stage);
    mkTitle(stage, v.label, idx);

    card.appendChild(stage);

    const meta = document.createElement("div");
    meta.className = "meta";
    meta.innerHTML = `<div class="name">${v.label}</div><div class="desc">${v.desc}</div><div class="tags">${v.tags.map(t=>`<span class="tag">${t}</span>`).join("")}</div>`;
    card.appendChild(meta);
    grid.appendChild(card);

    const render = () => {
      const rect = stage.getBoundingClientRect();
      const w = rect.width, h = rect.height;
      stage.querySelectorAll(".node,.ring,.center-hub,svg,.kpi").forEach(el=>el.remove());
      layoutFns[idx](stage, w, h);
    };
    window.addEventListener("resize", render);
    setTimeout(render, 0);
  });

  // Highlight active on switch
  switcherEl.addEventListener("click", () => {
    document.querySelectorAll(".sw-btn").forEach(b => b.classList.remove("active"));
    const activeId = document.body.getAttribute("data-theme");
    document.querySelector(`.sw-btn:nth-child(${variants.findIndex(v=>v.id===activeId)+1})`)?.classList.add("active");
  });
</script>
</body>
</html>
